# Produccion PostgreSQL. La cuenta de la API no necesita permisos para modificar el esquema.
spring.datasource.url=${DORNA_DB_URL}
spring.datasource.username=${DORNA_DB_USER}
spring.datasource.password=${DORNA_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.jdbc.template.query-timeout=15s
spring.jpa.properties.jakarta.persistence.query.timeout=15000
server.address=${DORNA_BIND_ADDRESS:127.0.0.1}
server.port=${DORNA_HTTPS_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${DORNA_TLS_KEYSTORE}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${DORNA_TLS_PASSWORD}
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.max-http-request-header-size=16KB
server.tomcat.max-connections=200
server.tomcat.threads.max=40
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=50
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=15s
server.tomcat.max-swallow-size=16KB
server.tomcat.max-http-form-post-size=16KB
server.tomcat.accesslog.enabled=false
dorna.audit.enabled=true
dorna.documentos.raiz=${DORNA_DOCUMENTOS_RAIZ}
dorna.limits.enabled=true
management.server.address=127.0.0.1
management.server.port=${DORNA_MANAGEMENT_PORT:9091}
management.server.ssl.enabled=false
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.access=read-only
management.endpoint.metrics.access=read-only
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.web=INFO
