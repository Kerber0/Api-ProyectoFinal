spring.application.name=api
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
dorna.security.secret=${DORNA_JWT_SECRET}
dorna.security.issuer=dorna-api
dorna.security.audience=dorna-mobile
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.forward-headers-strategy=none
spring.servlet.multipart.enabled=false
dorna.documentos.proveedor=local
dorna.documentos.raiz=${DORNA_DOCUMENTOS_RAIZ:.local/documentos}
management.endpoints.access.default=none
dorna.limits.enabled=true
dorna.limits.requests-per-minute=300
dorna.limits.writes-per-minute=20
dorna.limits.max-clients=10000
dorna.limits.max-body-bytes=16384
